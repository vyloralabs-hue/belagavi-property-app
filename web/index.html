<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="BELAGAVI PROPERTY LLP - Find Your Perfect Space">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BELAGAVI PROPERTY">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>BELAGAVI PROPERTY</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #0A0D11;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #FFFFFF;
    }
    #loading-fallback {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #0A0D11;
      color: #FDFCF4;
      z-index: 9999;
      transition: opacity 0.4s ease;
      text-align: center;
    }
    .fallback-title {
      font-size: 20px;
      font-weight: 700;
      color: #D4AF37;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .fallback-subtitle {
      font-size: 13px;
      color: #94A3B8;
      margin-bottom: 24px;
    }
    flutter-view, flt-glass-pane {
      width: 100% !important;
      height: 100% !important;
      display: block !important;
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
    }
  </style>

  <script>
    // Configure Flutter Web Engine Renderer for universal HTML rendering
    window._flutter = {
      config: {
        renderer: "html"
      }
    };

    // Global Web Diagnostic Script
    window.addEventListener('error', function(e) {
      console.error('[BelagaviWebError]', e.message, e.filename, e.lineno);
    });
    window.addEventListener('unhandledrejection', function(e) {
      console.error('[BelagaviWebPromiseError]', e.reason);
    });

    // Service Worker Cleanup — ensure obsolete service workers are fully unregistered
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        for (let r of registrations) {
          try {
            r.unregister();
          } catch (_) {}
        }
      });
    }

    // Helper to remove loading overlay
    function removeFallback() {
      const fallback = document.getElementById('loading-fallback');
      if (fallback) {
        fallback.style.opacity = '0';
        setTimeout(function() {
          if (fallback && fallback.parentNode) {
            fallback.parentNode.removeChild(fallback);
          }
        }, 400);
      }
    }

    // Observer to detect when Flutter mounts <flutter-view> or <flt-glass-pane>
    const observer = new MutationObserver(function(mutations) {
      for (let mutation of mutations) {
        for (let node of mutation.addedNodes) {
          if (node.nodeName === 'FLUTTER-VIEW' || node.nodeName === 'FLT-GLASS-PANE' || (node.classList && node.classList.contains('flt-glass-pane'))) {
            removeFallback();
            observer.disconnect();
            return;
          }
        }
      }
    });

    document.addEventListener('DOMContentLoaded', function() {
      observer.observe(document.body, { childList: true, subtree: true });
      if (document.querySelector('flutter-view') || document.querySelector('flt-glass-pane')) {
        removeFallback();
      }
    });

    window.addEventListener('flutter-first-frame', removeFallback);
    setTimeout(removeFallback, 5000);
  </script>
</head>
<body>
  <div id="loading-fallback">
    <div class="fallback-title">BELAGAVI PROPERTY LLP</div>
    <div class="fallback-subtitle">Loading Platform...</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
